name: Build Docker Image
run-name: Building image
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'README'
      - 'LICENSE'
      - 'Makefile'
      - '.gitignore'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'README'
      - 'LICENSE'
      - 'Makefile'
      - '.gitignore'

permissions:
  contents: read
  packages: write

env:
  TAG: '1.0'
  TEST_IMAGE: texlive-test
  # Pinned: mirror.ctan.org can redirect runners to mirrors with broken TLS
  TEXLIVE_SOURCE_URL: ${{ vars.TEXLIVE_SOURCE_URL || 'https://gb.mirrors.cicku.me/ctan' }}

jobs:
  build:
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Setting global values
        id: vars
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_OUTPUT}
          # Non-main runs get a dev tag so they never overwrite the release tag
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "TAG=${TAG}" >> ${GITHUB_OUTPUT}
          else
            echo "TAG=${TAG}-v${GITHUB_SHA::6}" >> ${GITHUB_OUTPUT}
          fi
      - name: Build Texlive image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          build-args: TEXLIVE_SOURCE_URL=${{ env.TEXLIVE_SOURCE_URL }}
          tags: ${{ env.TEST_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test
        run: |
          docker run --rm -v "${PWD}":/tex ${TEST_IMAGE} -interaction=nonstopmode -halt-on-error sample.tex
          test -s sample.pdf
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push Texlive image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: TEXLIVE_SOURCE_URL=${{ env.TEXLIVE_SOURCE_URL }}
          tags: ghcr.io/${{ steps.vars.outputs.OWNER_LC }}/texlive-full:${{ steps.vars.outputs.TAG }}
          cache-from: type=gha
